plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-fabric"
}

loom {
    accessWidenerPath = file("src/main/resources/shizuku.accesswidener")
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 前置：社区 Fabric 版拔刀剑（SlashBlade: Refabricated 26.1.2）
    compileOnly files("libs/SlashBlade-Refabricated-${slashblade_version}.jar")
    // Refabricated 的配置依赖（本地 jar）
    compileOnly files("libs/ForgeConfigAPIPort-v26.1.5-mc26.1.x-Fabric.jar")
    // Refabricated 的能力系统（CCA 8.0.0）
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:8.0.0"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:8.0.0"
    // JEI（26.1.2 Fabric 版，compileOnly）
    compileOnly "mezz.jei:jei-26.1.2-fabric-api:29.5.0.28"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    withSourcesJar()
}

jar {
    // 编译期占位类（骗过 mixin AP 的目标校验），运行时由 JEI 本体提供
    exclude 'mezz/jei/**'
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
